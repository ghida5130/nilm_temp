global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]
  - job_name: grafana
    static_configs:
      - targets: ["grafana:3000"]
  - job_name: blackbox-exporter
    static_configs:
      - targets: ["blackbox-exporter:9115"]
  - job_name: ai-analysis
    file_sd_configs:
      - files: ["/etc/prometheus/targets/ai.json"]
        refresh_interval: 30s
  - job_name: service-http
    metrics_path: /probe
    params:
      module: [http_2xx]
    file_sd_configs:
      - files: ["/etc/prometheus/targets/http.json"]
        refresh_interval: 30s
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
  - job_name: service-tcp
    metrics_path: /probe
    params:
      module: [tcp_connect]
    file_sd_configs:
      - files: ["/etc/prometheus/targets/tcp.json"]
        refresh_interval: 30s
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
  - job_name: cadvisor
    file_sd_configs:
      - files: ["/etc/prometheus/resources/cadvisor.json"]
        refresh_interval: 30s
