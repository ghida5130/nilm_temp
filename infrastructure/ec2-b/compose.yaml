name: nilm-b
services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
      POSTGRES_DB: postgres
    ports:
      - "${EC2_B_PRIVATE_IP:?EC2_B_PRIVATE_IP required}:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ${CONFIG_ROOT:-.}/postgres/01-create-databases.sql:/docker-entrypoint-initdb.d/01-create-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  kafka:
    image: apache/kafka:3.9.0
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:-5L6g3nShT-eMCtK--X86sw}
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:19092,CONTROLLER://:9093,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://${EC2_B_PRIVATE_IP:?EC2_B_PRIVATE_IP required}:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms512m -Xmx512m
    ports:
      - "${EC2_B_PRIVATE_IP:?EC2_B_PRIVATE_IP required}:9092:9092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:19092 --list >/dev/null"]
      interval: 10s
      timeout: 10s
      retries: 20
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  kafka-init:
    image: apache/kafka:3.9.0
    restart: "no"
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_RAW_TOPIC: ${KAFKA_RAW_TOPIC:-power.raw.v1}
      KAFKA_ANALYSIS_EVENT_TOPIC: ${KAFKA_ANALYSIS_EVENT_TOPIC:-analysis.event.v1}
      KAFKA_ANALYSIS_ACTIVITY_TOPIC: ${KAFKA_ANALYSIS_ACTIVITY_TOPIC:-analysis.activity.v1}
      KAFKA_ANALYSIS_DATA_QUALITY_TOPIC: ${KAFKA_ANALYSIS_DATA_QUALITY_TOPIC:-analysis.data-quality.v1}
      KAFKA_ANALYSIS_SNAPSHOT_TOPIC: ${KAFKA_ANALYSIS_SNAPSHOT_TOPIC:-analysis.snapshot.v1}
      KAFKA_ANALYSIS_DLQ_TOPIC: ${KAFKA_ANALYSIS_DLQ_TOPIC:-dlq.analysis}
      KAFKA_MONITORING_DLQ_TOPIC: ${KAFKA_MONITORING_DLQ_TOPIC:-dlq.monitoring}
      KAFKA_PARTITIONS: ${KAFKA_PARTITIONS:-24}
      KAFKA_RAW_RETENTION_MS: ${KAFKA_RAW_RETENTION_MS:-604800000}
      KAFKA_RAW_RETENTION_BYTES: ${KAFKA_RAW_RETENTION_BYTES:-2147483648}
      KAFKA_RAW_SEGMENT_BYTES: ${KAFKA_RAW_SEGMENT_BYTES:-268435456}
      KAFKA_ANALYSIS_RETENTION_MS: ${KAFKA_ANALYSIS_RETENTION_MS:-604800000}
      KAFKA_ANALYSIS_RETENTION_BYTES: ${KAFKA_ANALYSIS_RETENTION_BYTES:-134217728}
      KAFKA_ANALYSIS_SEGMENT_BYTES: ${KAFKA_ANALYSIS_SEGMENT_BYTES:-134217728}
      KAFKA_DLQ_RETENTION_MS: ${KAFKA_DLQ_RETENTION_MS:-2592000000}
      KAFKA_DLQ_RETENTION_BYTES: ${KAFKA_DLQ_RETENTION_BYTES:-268435456}
      KAFKA_DLQ_SEGMENT_BYTES: ${KAFKA_DLQ_SEGMENT_BYTES:-134217728}
    entrypoint: ["/bin/bash", "-ec"]
    command:
      - |
        configure_topic() {
          topic="$$1"
          retention_ms="$$2"
          retention_bytes="$$3"
          segment_bytes="$$4"
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists --topic "$$topic" --partitions "$$KAFKA_PARTITIONS" --replication-factor 1
          /opt/kafka/bin/kafka-configs.sh --bootstrap-server kafka:19092 --entity-type topics --entity-name "$$topic" --alter --add-config "cleanup.policy=delete,retention.ms=$$retention_ms,retention.bytes=$$retention_bytes,segment.bytes=$$segment_bytes"
          /opt/kafka/bin/kafka-configs.sh --bootstrap-server kafka:19092 --entity-type topics --entity-name "$$topic" --describe
        }
        configure_topic "$$KAFKA_RAW_TOPIC" "$$KAFKA_RAW_RETENTION_MS" "$$KAFKA_RAW_RETENTION_BYTES" "$$KAFKA_RAW_SEGMENT_BYTES"
        configure_topic "$$KAFKA_ANALYSIS_EVENT_TOPIC" "$$KAFKA_ANALYSIS_RETENTION_MS" "$$KAFKA_ANALYSIS_RETENTION_BYTES" "$$KAFKA_ANALYSIS_SEGMENT_BYTES"
        configure_topic "$$KAFKA_ANALYSIS_ACTIVITY_TOPIC" "$$KAFKA_ANALYSIS_RETENTION_MS" "$$KAFKA_ANALYSIS_RETENTION_BYTES" "$$KAFKA_ANALYSIS_SEGMENT_BYTES"
        configure_topic "$$KAFKA_ANALYSIS_DATA_QUALITY_TOPIC" "$$KAFKA_ANALYSIS_RETENTION_MS" "$$KAFKA_ANALYSIS_RETENTION_BYTES" "$$KAFKA_ANALYSIS_SEGMENT_BYTES"
        configure_topic "$$KAFKA_ANALYSIS_SNAPSHOT_TOPIC" "$$KAFKA_ANALYSIS_RETENTION_MS" "$$KAFKA_ANALYSIS_RETENTION_BYTES" "$$KAFKA_ANALYSIS_SEGMENT_BYTES"
        configure_topic "$$KAFKA_ANALYSIS_DLQ_TOPIC" "$$KAFKA_DLQ_RETENTION_MS" "$$KAFKA_DLQ_RETENTION_BYTES" "$$KAFKA_DLQ_SEGMENT_BYTES"
        configure_topic "$$KAFKA_MONITORING_DLQ_TOPIC" "$$KAFKA_DLQ_RETENTION_MS" "$$KAFKA_DLQ_RETENTION_BYTES" "$$KAFKA_DLQ_SEGMENT_BYTES"
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --describe --topic "$$KAFKA_RAW_TOPIC"
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --describe --topic "$$KAFKA_ANALYSIS_EVENT_TOPIC"
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --describe --topic "$$KAFKA_ANALYSIS_ACTIVITY_TOPIC"
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --describe --topic "$$KAFKA_ANALYSIS_DATA_QUALITY_TOPIC"
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --describe --topic "$$KAFKA_ANALYSIS_SNAPSHOT_TOPIC"
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --describe --topic "$$KAFKA_ANALYSIS_DLQ_TOPIC"
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --describe --topic "$$KAFKA_MONITORING_DLQ_TOPIC"

  realtime-analysis-service:
    image: ${REALTIME_ANALYSIS_IMAGE:?REALTIME_ANALYSIS_IMAGE required}
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      KAFKA_INPUT_TOPIC: ${KAFKA_RAW_TOPIC:-power.raw.v1}
      KAFKA_DLQ_TOPIC: ${KAFKA_ANALYSIS_DLQ_TOPIC:-dlq.analysis}
      KAFKA_ANALYSIS_EVENT_TOPIC: ${KAFKA_ANALYSIS_EVENT_TOPIC:-analysis.event.v1}
      KAFKA_ANALYSIS_ACTIVITY_TOPIC: ${KAFKA_ANALYSIS_ACTIVITY_TOPIC:-analysis.activity.v1}
      KAFKA_ANALYSIS_DATA_QUALITY_TOPIC: ${KAFKA_ANALYSIS_DATA_QUALITY_TOPIC:-analysis.data-quality.v1}
      KAFKA_ANALYSIS_SNAPSHOT_TOPIC: ${KAFKA_ANALYSIS_SNAPSHOT_TOPIC:-analysis.snapshot.v1}
      KAFKA_GROUP_ID: ${ANALYSIS_KAFKA_GROUP_ID:-realtime-analysis-service-v1}
      KAFKA_AUTO_OFFSET_RESET: ${ANALYSIS_KAFKA_AUTO_OFFSET_RESET:-latest}
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: analysis_db
      DATABASE_USER: ${POSTGRES_USER:?POSTGRES_USER required}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
      MODEL_WINDOW_SIZE: ${ANALYSIS_MODEL_WINDOW_SIZE:-299}
      MODEL_MANIFEST_FILE: config/model_manifest.json
      BASELINE_FILE: config/baselines.json
      FAKE_ON_APPLIANCES: ${ANALYSIS_FAKE_ON_APPLIANCES:-}
      ANALYSIS_SCORE_THRESHOLD: ${ANALYSIS_SCORE_THRESHOLD:-80}
      ANALYSIS_TIMEZONE: ${ANALYSIS_TIMEZONE:-Asia/Seoul}
      ANALYSIS_EXPECTED_SAMPLES_PER_DAY: ${ANALYSIS_EXPECTED_SAMPLES_PER_DAY:-86400}
      ANALYSIS_OBSERVATION_VALID_COVERAGE_RATIO: ${ANALYSIS_OBSERVATION_VALID_COVERAGE_RATIO:-0.95}
      ROUTINE_BASELINE_REFRESH_SECONDS: ${ROUTINE_BASELINE_REFRESH_SECONDS:-60}
      LOG_LEVEL: ${ANALYSIS_LOG_LEVEL:-INFO}
    ports:
      - "${EC2_B_PRIVATE_IP:?EC2_B_PRIVATE_IP required}:8000:8000"
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=5).close()"
      interval: 10s
      timeout: 10s
      start_period: 30s
      retries: 12
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  aggregation-service:
    image: ${AGGREGATION_IMAGE:?AGGREGATION_IMAGE required}
    restart: unless-stopped
    init: true
    stop_grace_period: 5m
    environment:
      HTTP_HOST: 0.0.0.0
      HTTP_PORT: 8000
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      KAFKA_ANALYSIS_EVENT_TOPIC: ${KAFKA_ANALYSIS_EVENT_TOPIC:-analysis.event.v1}
      KAFKA_ANALYSIS_ACTIVITY_TOPIC: ${KAFKA_ANALYSIS_ACTIVITY_TOPIC:-analysis.activity.v1}
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: analysis_db
      DATABASE_USER: ${POSTGRES_USER:?POSTGRES_USER required}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
      BASELINE_FILE: config/baselines.json
      ANALYSIS_TIMEZONE: ${ANALYSIS_TIMEZONE:-Asia/Seoul}
      ANALYSIS_EXPECTED_SAMPLES_PER_DAY: ${ANALYSIS_EXPECTED_SAMPLES_PER_DAY:-86400}
      ANALYSIS_OBSERVATION_VALID_COVERAGE_RATIO: ${ANALYSIS_OBSERVATION_VALID_COVERAGE_RATIO:-0.95}
      ACTIVITY_INDEX_PUBLISH_HOUR: ${ACTIVITY_INDEX_PUBLISH_HOUR:-0}
      ACTIVITY_INDEX_PUBLISH_MINUTE: ${ACTIVITY_INDEX_PUBLISH_MINUTE:-10}
      ACTIVITY_INDEX_SCHEDULER_POLL_SECONDS: ${ACTIVITY_INDEX_SCHEDULER_POLL_SECONDS:-30}
      ROUTINE_BASELINE_WINDOW_DAYS: ${ROUTINE_BASELINE_WINDOW_DAYS:-28}
      ROUTINE_BASELINE_MINIMUM_SAMPLE_DAYS: ${ROUTINE_BASELINE_MINIMUM_SAMPLE_DAYS:-14}
      ROUTINE_BASELINE_MINIMUM_WEEKDAY_SAMPLE_DAYS: ${ROUTINE_BASELINE_MINIMUM_WEEKDAY_SAMPLE_DAYS:-4}
      ROUTINE_BASELINE_MINIMUM_DAILY_USE_PROBABILITY: ${ROUTINE_BASELINE_MINIMUM_DAILY_USE_PROBABILITY:-0.70}
      LOG_LEVEL: ${AGGREGATION_LOG_LEVEL:-INFO}
      HDFS_URL: http://namenode:9870
      BRONZE_BASE: ${BRONZE_BASE:-/nilm/bronze/power}
      BRONZE_MANIFEST_BASE: ${BRONZE_MANIFEST_BASE:-/nilm/manifests/job=bronze-loader}
      RETENTION_MANIFEST_BASE: ${RETENTION_MANIFEST_BASE:-/nilm/manifests/job=retention}
      RETENTION_ENABLED: ${RETENTION_ENABLED:-true}
      RETENTION_APPLY: ${RETENTION_APPLY:-false}
      RETENTION_REQUIRE_COMPACTION: ${RETENTION_REQUIRE_COMPACTION:-true}
      BRONZE_RETENTION_DAYS: ${BRONZE_RETENTION_DAYS:-14}
      BRONZE_GRACE_DAYS: ${BRONZE_GRACE_DAYS:-3}
      RETENTION_MAX_DELETE_BYTES: ${RETENTION_MAX_DELETE_BYTES:-5368709120}
      RETENTION_MAX_DELETE_DATES: ${RETENTION_MAX_DELETE_DATES:-1}
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      realtime-analysis-service:
        condition: service_healthy
      datanode:
        condition: service_started
      hdfs-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=5).close()"
      interval: 10s
      timeout: 10s
      start_period: 30s
      retries: 12
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  mqtt-kafka-bridge:
    image: ${MQTT_KAFKA_BRIDGE_IMAGE:?MQTT_KAFKA_BRIDGE_IMAGE required}
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    environment:
      MQTT_HOST: ${MQTT_HOST:?MQTT_HOST required}
      MQTT_PORT: ${MQTT_PORT:-8883}
      MQTT_USER: ${MQTT_USER:?MQTT_USER required}
      MQTT_PASS: ${MQTT_PASS:?MQTT_PASS required}
      MQTT_TOPIC: v1/power/sim/+/main
      MQTT_CLIENT_ID: nilm-kafka-bridge
      MQTT_TLS_ENABLED: "true"
      MQTT_CA_FILE: ${MQTT_CA_FILE:-/etc/mqtt/ca.crt}
      KAFKA_BOOTSTRAP: kafka:19092
      KAFKA_TOPIC: ${KAFKA_RAW_TOPIC:-power.raw.v1}
    volumes:
      - ${CONFIG_ROOT:-.}/mqtt/certs:/etc/mqtt:ro
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    restart: unless-stopped
    environment:
      CLUSTER_NAME: nilm
      CORE_CONF_fs_defaultFS: hdfs://namenode:9000
      HDFS_CONF_dfs_replication: 1
      HDFS_CONF_dfs_permissions_enabled: "false"
    ports:
      - "${EC2_B_PRIVATE_IP:?EC2_B_PRIVATE_IP required}:9870:9870"
    volumes:
      - namenode_data:/hadoop/dfs/name
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  datanode:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    restart: unless-stopped
    environment:
      CORE_CONF_fs_defaultFS: hdfs://namenode:9000
      HDFS_CONF_dfs_replication: 1
      HDFS_CONF_dfs_permissions_enabled: "false"
      SERVICE_PRECONDITION: "namenode:9870"
    volumes:
      - datanode_data:/hadoop/dfs/data
    depends_on:
      - namenode
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  hdfs-init:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    restart: "no"
    environment:
      CORE_CONF_fs_defaultFS: hdfs://namenode:9000
      SERVICE_PRECONDITION: "namenode:9870 datanode:9864"
      HDFS_QUOTA_ENABLED: ${HDFS_QUOTA_ENABLED:-true}
      HDFS_TOTAL_QUOTA: ${HDFS_TOTAL_QUOTA:-80g}
      HDFS_BRONZE_QUOTA: ${HDFS_BRONZE_QUOTA:-32g}
      HDFS_QUARANTINE_QUOTA: ${HDFS_QUARANTINE_QUOTA:-8g}
      HDFS_SESSION_BRONZE_QUOTA: ${HDFS_SESSION_BRONZE_QUOTA:-4g}
      HDFS_MANIFEST_QUOTA: ${HDFS_MANIFEST_QUOTA:-2g}
      HDFS_SILVER_QUOTA: ${HDFS_SILVER_QUOTA:-24g}
      HDFS_GOLD_QUOTA: ${HDFS_GOLD_QUOTA:-2g}
    command: ["/bin/bash", "/opt/nilm/hdfs-init.sh"]
    volumes:
      - ${CONFIG_ROOT:-.}/hdfs-init.sh:/opt/nilm/hdfs-init.sh:ro
    depends_on:
      - namenode
      - datanode

  node-exporter:
    image: prom/node-exporter:v1.9.1
    restart: unless-stopped
    command:
      - --path.rootfs=/host
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run)($$|/)
    ports:
      - "${EC2_B_PRIVATE_IP:?EC2_B_PRIVATE_IP required}:9100:9100"
    volumes:
      - /:/host:ro,rslave
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  bronze-loader:
    image: ${BRONZE_LOADER_IMAGE:?BRONZE_LOADER_IMAGE required}
    restart: unless-stopped
    init: true
    stop_grace_period: 60s
    environment:
      KAFKA_BOOTSTRAP: kafka:19092
      KAFKA_TOPIC: ${KAFKA_RAW_TOPIC:-power.raw.v1}
      GROUP_ID: ${BRONZE_KAFKA_GROUP_ID:-hdfs-bronze-loader}
      HDFS_URL: http://namenode:9870
      BRONZE_BASE: ${BRONZE_BASE:-/nilm/bronze/power}
      QUARANTINE_BASE: ${BRONZE_QUARANTINE_BASE:-/nilm/quarantine/power}
      MANIFEST_BASE: ${BRONZE_MANIFEST_BASE:-/nilm/manifests/job=bronze-loader}
      FLUSH_SECS: ${BRONZE_FLUSH_SECS:-300}
      MAX_BUFFER: ${BRONZE_MAX_BUFFER:-50000}
      BUSINESS_TIMEZONE: ${ANALYSIS_TIMEZONE:-Asia/Seoul}
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      datanode:
        condition: service_started
      hdfs-init:
        condition: service_completed_successfully
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # appliance_usage_session outbox -> HDFS Bronze 적재기(단일 인스턴스).
  # 초기 전체 적재는 배포 후 한 번: docker compose run --rm --no-deps session-lake-loader session-lake-loader initial-load
  session-lake-loader:
    image: ${SESSION_LAKE_LOADER_IMAGE:?SESSION_LAKE_LOADER_IMAGE required}
    restart: unless-stopped
    init: true
    stop_grace_period: 2m
    environment:
      HTTP_HOST: 0.0.0.0
      HTTP_PORT: 8000
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: analysis_db
      DATABASE_USER: ${POSTGRES_USER:?POSTGRES_USER required}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
      HDFS_URL: http://namenode:9870
      HDFS_USER: root
      SESSION_BRONZE_BASE: ${SESSION_BRONZE_BASE:-/nilm/bronze/appliance-session}
      SESSION_MANIFEST_BASE: ${SESSION_MANIFEST_BASE:-/nilm/manifests/job=session-lake-loader}
      LOADER_POLL_SECONDS: ${SESSION_LAKE_POLL_SECONDS:-60}
      LOADER_BATCH_MAX_EVENTS: ${SESSION_LAKE_BATCH_MAX_EVENTS:-5000}
      LOADER_MAX_BATCHES_PER_CYCLE: ${SESSION_LAKE_MAX_BATCHES_PER_CYCLE:-20}
      LOADER_ROWS_PER_FILE: ${SESSION_LAKE_ROWS_PER_FILE:-200000}
      LOADER_RETRY_BACKOFF_SECONDS: ${SESSION_LAKE_RETRY_BACKOFF_SECONDS:-30}
      LOADER_RETRY_MAX_BACKOFF_SECONDS: ${SESSION_LAKE_RETRY_MAX_BACKOFF_SECONDS:-900}
      LOADER_MAX_ATTEMPTS: ${SESSION_LAKE_MAX_ATTEMPTS:-0}
      LOG_LEVEL: ${SESSION_LAKE_LOG_LEVEL:-INFO}
    ports:
      - "${EC2_B_PRIVATE_IP:?EC2_B_PRIVATE_IP required}:8002:8000"
    depends_on:
      postgres:
        condition: service_healthy
      realtime-analysis-service:
        condition: service_healthy
      datanode:
        condition: service_started
      hdfs-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=5).close()"
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 6
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
    name: nilm-b_postgres_data
  kafka_data:
    name: nilm-b_kafka_data
  namenode_data:
    name: nilm-b_namenode_data
  datanode_data:
    name: nilm-b_datanode_data
