[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "realtime-analysis-service"
version = "0.1.0"
description = "Kafka-based realtime power analysis service"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13,<2",
    "confluent-kafka==2.6.0",
    "pydantic>=2,<3",
    "pydantic-settings>=2,<3",
    "prometheus-client>=0.21,<1",
    "psycopg[binary]>=3.2,<4",
    "SQLAlchemy>=2.0,<3",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-cov>=6,<7",
]

[project.scripts]
realtime-analysis = "realtime_analysis.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.coverage.run]
relative_files = true
