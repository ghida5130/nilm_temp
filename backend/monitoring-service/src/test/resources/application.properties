# 테스트 전용 설정: PostgreSQL 없이 H2 인메모리 DB로 실행된다.
spring.datasource.url=jdbc:h2:mem:monitoring_db;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.flyway.enabled=true

management.health.redis.enabled=false
app.security.enabled=false
app.security.local-user-id=test-user
app.kafka.consumer.enabled=false
app.kafka.analysis-event-topic=analysis.event.v1
app.kafka.dlq-topic=dlq.monitoring
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=monitoring-service-test
spring.kafka.consumer.auto-offset-reset=earliest
app.web-push.enabled=false
