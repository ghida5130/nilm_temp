# 테스트 전용 설정: PostgreSQL 없이 H2 인메모리 DB로 실행된다.
spring.datasource.url=jdbc:h2:mem:monitoring_db;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.flyway.enabled=true

management.health.redis.enabled=false
app.security.enabled=false
app.test-data.enabled=false

app.push.test-auth-sub=test-subject-3
app.push.enabled=false
app.away-mode.scheduler-enabled=false
spring.kafka.listener.auto-startup=false
spring.kafka.consumer.group-id=monitoring-test
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# 브로커 없이 도는 테스트라 발행은 실패한다. 대기 없이 즉시 실패하게 둔다.
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.properties.max.block.ms=100
