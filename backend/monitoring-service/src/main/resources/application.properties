spring.application.name=monitoring-service
server.port=${SERVER_PORT:8082}

# DB (비밀번호는 반드시 환경변수 POSTGRES_PASSWORD로 주입 - 하드코딩 금지)
spring.datasource.url=${POSTGRES_URL:jdbc:postgresql://localhost:5432/monitoring_db}
spring.datasource.username=${POSTGRES_USER:nilm_admin}
spring.datasource.password=${POSTGRES_PASSWORD:}

# JPA: 스키마 변경은 Flyway로만 관리
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# Redis 연결 준비 (아직 미사용) - 로컬에 Redis가 없어도 실행되도록 헬스 지표는 꺼둔다
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
management.health.redis.enabled=${REDIS_HEALTH_ENABLED:false}

# 보안 스위치: false면 Keycloak 없이 실행 가능 (모든 요청 허용)
app.security.enabled=${APP_SECURITY_ENABLED:false}
# Keycloak 도입 후 보안을 켤 때 주석 해제하고 환경변수로 주입
spring.security.oauth2.resourceserver.jwt.issuer-uri=${JWT_ISSUER_URI:http://localhost:8090/realms/nilm}

# Actuator / OpenAPI
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db
springdoc.swagger-ui.path=/swagger-ui.html

# analysis.event.v1 consumer
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=${MONITORING_KAFKA_GROUP_ID:monitoring-service-analysis-event-v1}
spring.kafka.consumer.auto-offset-reset=${KAFKA_AUTO_OFFSET_RESET:earliest}
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.isolation-level=read_committed
app.kafka.consumer.enabled=${KAFKA_CONSUMER_ENABLED:true}
app.kafka.analysis-event-topic=${KAFKA_ANALYSIS_EVENT_TOPIC:analysis.event.v1}
app.kafka.dlq-topic=${KAFKA_MONITORING_DLQ_TOPIC:dlq.monitoring}
app.incident.max-event-age=${INCIDENT_MAX_EVENT_AGE:PT24H}

# Web Push. VAPID private key must only be supplied through an environment secret.
app.web-push.enabled=${WEB_PUSH_ENABLED:false}
app.web-push.vapid-public-key=${WEB_PUSH_VAPID_PUBLIC_KEY:}
app.web-push.vapid-private-key=${WEB_PUSH_VAPID_PRIVATE_KEY:}
app.web-push.subject=${WEB_PUSH_SUBJECT:mailto:admin@example.com}
app.notification.response-timeout=${NOTIFICATION_RESPONSE_TIMEOUT:PT30S}
app.notification.dispatch-delay-ms=${NOTIFICATION_DISPATCH_DELAY_MS:2000}
app.notification.expiry-delay-ms=${NOTIFICATION_EXPIRY_DELAY_MS:5000}
app.outbox.dispatch-delay-ms=${UI_OUTBOX_DISPATCH_DELAY_MS:500}
app.sse.heartbeat-delay-ms=${SSE_HEARTBEAT_DELAY_MS:25000}

# Local-only principal used when APP_SECURITY_ENABLED=false.
app.security.local-user-id=${LOCAL_USER_ID:local-user}
